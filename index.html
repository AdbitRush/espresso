<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#17110c" />
<title>Espresso — your brew guide</title>
<meta name="description" content="Grind numbers and step-by-step recipes for the Varia VS3, DeLonghi Dedica and moka pot." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ground:#f1e8d9; --card:#fdf8ef; --card-2:#e9dcc9;
    --ink:#281c12; --ink-soft:#6e5b48; --hair:#ded0bb;
    --crema:#b0631e; --crema-bright:#d5872a; --copper:#8c4d20;
    --led:#2c7a4c; --warn:#b26a12;
    --readout-bg:#20160e; --readout-ink:#f2c485; --readout-dim:#8a6a45;
    --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 30px rgba(80,50,20,.08);
    --r:16px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#17110c; --card:#221912; --card-2:#2d2219;
      --ink:#f1e8db; --ink-soft:#b19c86; --hair:#3a2b1f;
      --crema:#e0a45b; --crema-bright:#f0b667; --copper:#c9834a;
      --led:#4fc98a; --warn:#e6a748;
      --readout-bg:#0c0805; --readout-ink:#f3c986; --readout-dim:#7a5f43;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{
    --ground:#f1e8d9; --card:#fdf8ef; --card-2:#e9dcc9;
    --ink:#281c12; --ink-soft:#6e5b48; --hair:#ded0bb;
    --crema:#b0631e; --crema-bright:#d5872a; --copper:#8c4d20;
    --led:#2c7a4c; --warn:#b26a12;
    --readout-bg:#20160e; --readout-ink:#f2c485; --readout-dim:#8a6a45;
    --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 30px rgba(80,50,20,.08);
  }
  :root[data-theme="dark"]{
    --ground:#17110c; --card:#221912; --card-2:#2d2219;
    --ink:#f1e8db; --ink-soft:#b19c86; --hair:#3a2b1f;
    --crema:#e0a45b; --crema-bright:#f0b667; --copper:#c9834a;
    --led:#4fc98a; --warn:#e6a748;
    --readout-bg:#0c0805; --readout-ink:#f3c986; --readout-dim:#7a5f43;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--ink);
    background:var(--ground);
    background-image:
      radial-gradient(120% 80% at 100% -10%, color-mix(in oklab,var(--crema) 12%,transparent), transparent 60%),
      radial-gradient(90% 70% at -10% 0%, color-mix(in oklab,var(--copper) 9%,transparent), transparent 55%);
    background-attachment:fixed;
    font-family:"Archivo",system-ui,sans-serif; line-height:1.55;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:680px;margin:0 auto;padding:22px 18px 96px}

  /* ---- header ---- */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;
      padding-bottom:16px;border-bottom:1px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .mark{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;box-shadow:var(--shadow);
      background:linear-gradient(155deg,var(--crema-bright),var(--copper) 78%);
      position:relative;overflow:hidden}
  .mark::before{content:"";position:absolute;inset:0;
      background:radial-gradient(80% 60% at 30% 12%,rgba(255,255,255,.4),transparent 60%)}
  .mark svg{width:26px;height:26px;position:relative;z-index:1;overflow:visible}
  .mark .cupsteam{animation:cupsteam 3.4s ease-in-out infinite}
  .mark .cupsteam.s2{animation-delay:1.1s}
  @keyframes cupsteam{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:.9;transform:translateY(-1.5px)}}
  @media (prefers-reduced-motion:reduce){.mark .cupsteam{animation:none}}
  .brand h1{font-family:"Fraunces",serif;font-weight:600;font-size:1.42rem;letter-spacing:-.015em;margin:0;line-height:1}
  .brand p{margin:3px 0 0;font-size:.72rem;color:var(--ink-soft);letter-spacing:.03em}
  .theme-btn{flex:none;background:var(--card);border:1px solid var(--hair);color:var(--ink-soft);
      width:40px;height:40px;border-radius:11px;cursor:pointer;font-size:1.05rem;display:grid;place-items:center;
      transition:transform .15s ease,color .15s ease}
  .theme-btn:hover{color:var(--crema);transform:rotate(-12deg)}
  .theme-btn:focus-visible{outline:2px solid var(--crema);outline-offset:2px}

  .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft);
      font-weight:600;margin:0 0 9px}

  /* ---- machine segmented ---- */
  .machines{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:22px}
  @media (min-width:520px){.machines{grid-template-columns:repeat(4,1fr)}}
  .machine{position:relative;background:var(--card);border:1px solid var(--hair);border-radius:14px;
      padding:13px 10px 11px;cursor:pointer;text-align:left;color:var(--ink);
      transition:border-color .18s ease,transform .12s ease,background .18s ease;font-family:inherit}
  .machine:hover{transform:translateY(-2px)}
  .machine:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
  .machine .ic{font-size:1.35rem;line-height:1;display:block;margin-bottom:7px}
  .machine .mn{font-weight:600;font-size:.86rem;letter-spacing:-.01em;display:block}
  .machine .ms{font-size:.68rem;color:var(--ink-soft);display:block;margin-top:1px}
  .machine[aria-pressed="true"]{border-color:var(--crema);background:
      linear-gradient(180deg,color-mix(in oklab,var(--crema) 14%,var(--card)),var(--card))}
  .machine[aria-pressed="true"]::before{content:"";position:absolute;top:9px;right:9px;width:8px;height:8px;
      border-radius:50%;background:var(--crema-bright);box-shadow:0 0 0 3px color-mix(in oklab,var(--crema) 30%,transparent)}

  /* ---- drink chips ---- */
  .drinks{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px}
  .chip{background:var(--card);border:1px solid var(--hair);color:var(--ink-soft);
      padding:7px 13px;border-radius:999px;font-size:.82rem;font-weight:500;cursor:pointer;font-family:inherit;
      transition:all .15s ease}
  .chip:hover{color:var(--ink);border-color:var(--crema)}
  .chip:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

  /* ---- recipe card ---- */
  .recipe{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);
      overflow:hidden;animation:rise .4s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.recipe{animation:none}}

  .rhead{padding:20px 20px 4px}
  .rhead h2{font-family:"Fraunces",serif;font-weight:600;font-size:1.6rem;letter-spacing:-.015em;margin:0;
      text-wrap:balance;line-height:1.05}
  .rhead .sub{color:var(--ink-soft);font-size:.86rem;margin:5px 0 0}

  /* readout strip */
  .readout{margin:16px 20px 0;background:var(--readout-bg);border-radius:13px;padding:15px 8px;
      display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:4px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .cell{text-align:center;padding:0 6px;position:relative}
  .cell + .cell::before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;
      background:rgba(243,201,134,.14)}
  .cell .k{font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--readout-dim);
      font-weight:600;margin-bottom:5px}
  .cell .v{font-family:"JetBrains Mono",monospace;color:var(--readout-ink);font-weight:700;
      font-size:1.02rem;line-height:1;font-variant-numeric:tabular-nums;
      text-shadow:0 0 12px color-mix(in oklab,var(--readout-ink) 45%,transparent)}
  .cell .u{font-size:.58rem;color:var(--readout-dim);margin-top:3px;letter-spacing:.04em}
  .cell.grind .v{font-size:1.55rem}
  .cell.grind .k{color:var(--readout-ink);opacity:.75}

  .dial-note{margin:11px 20px 0;font-size:.76rem;color:var(--ink-soft);display:flex;gap:7px;align-items:flex-start}
  .dial-note b{color:var(--crema);font-weight:600}

  /* steps */
  .sec-t{font-family:"Fraunces",serif;font-weight:600;font-size:1.02rem;margin:24px 20px 12px;
      display:flex;align-items:center;gap:8px}
  .sec-t::after{content:"";flex:1;height:1px;background:var(--hair)}
  ol.steps{list-style:none;margin:0;padding:0 20px;counter-reset:s}
  ol.steps li{counter-increment:s;position:relative;padding:0 0 16px 40px;font-size:.92rem}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;
      border-radius:8px;background:var(--card-2);color:var(--crema);font-family:"JetBrains Mono",monospace;
      font-weight:700;font-size:.82rem;display:grid;place-items:center;border:1px solid var(--hair)}
  ol.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:26px;bottom:6px;width:1px;
      background:var(--hair)}
  ol.steps li b{color:var(--ink);font-weight:600}
  ol.steps li .hl{color:var(--crema);font-weight:600;font-family:"JetBrains Mono",monospace;font-size:.88em}

  /* timer */
  .timer{margin:6px 20px 4px;background:var(--card-2);border:1px solid var(--hair);border-radius:13px;
      padding:14px 16px;display:flex;align-items:center;gap:14px}
  .timer .disp{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;
      color:var(--ink);min-width:96px;letter-spacing:-.02em}
  .timer .disp.hot{color:var(--led)}
  .timer .disp.over{color:var(--warn)}
  .timer .meta{flex:1;min-width:0}
  .timer .meta .tt{font-size:.78rem;color:var(--ink-soft)}
  .timer .meta .tgt{font-size:.72rem;color:var(--crema);font-weight:600;font-family:"JetBrains Mono",monospace}
  .tbtn{flex:none;border:none;border-radius:10px;padding:10px 16px;font-family:inherit;font-weight:600;
      font-size:.84rem;cursor:pointer;background:var(--crema);color:#fff;transition:filter .15s}
  .tbtn:hover{filter:brightness(1.06)}
  .tbtn.rst{background:var(--card);color:var(--ink-soft);border:1px solid var(--hair)}
  .tbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* milk */
  .milk-box{margin:0 20px;background:color-mix(in oklab,var(--crema) 8%,var(--card));border:1px solid var(--hair);
      border-radius:12px;padding:13px 15px;font-size:.88rem}
  .milk-box .mt{font-weight:600;color:var(--crema);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}

  /* gear */
  .gear{padding:0 20px 22px}
  .gear ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .gear li{display:flex;gap:11px;align-items:flex-start;background:var(--card-2);border:1px solid var(--hair);
      border-radius:11px;padding:11px 13px}
  .gear .gi{font-size:1.15rem;line-height:1.3;flex:none}
  .gear .gn{font-weight:600;font-size:.86rem}
  .gear .gw{font-size:.78rem;color:var(--ink-soft);margin-top:1px}
  .gear .star{color:var(--crema);font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
      border:1px solid var(--crema);border-radius:5px;padding:1px 5px;margin-left:6px;white-space:nowrap}

  footer{text-align:center;color:var(--ink-soft);font-size:.74rem;margin-top:26px;line-height:1.6}
  footer a{color:var(--crema)}

  /* ---- animated step player ---- */
  .player{margin:4px 20px 0;border:1px solid var(--hair);border-radius:15px;overflow:hidden;background:var(--card-2)}
  .stage{position:relative;aspect-ratio:22/13;display:grid;place-items:center;
      background:radial-gradient(130% 130% at 50% 8%,color-mix(in oklab,var(--crema) 13%,var(--card)),var(--card-2))}
  .stage svg{width:74%;height:82%;display:block}
  .stage .scene{animation:sceneIn .45s cubic-bezier(.2,.7,.3,1)}
  @keyframes sceneIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  .pctl{display:flex;align-items:center;gap:9px;padding:12px 12px 6px}
  .pnav{flex:none;width:42px;height:42px;border:1px solid var(--hair);background:var(--card);border-radius:11px;
      color:var(--ink);font-size:1.35rem;line-height:1;cursor:pointer;display:grid;place-items:center;
      transition:border-color .15s,color .15s,transform .12s;font-family:inherit}
  .pnav:hover:not(:disabled){border-color:var(--crema);color:var(--crema)}
  .pnav:active:not(:disabled){transform:scale(.92)}
  .pnav:disabled{opacity:.32;cursor:default}
  .pnav:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
  .pmid{flex:1;min-width:0}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pn{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
      color:var(--crema);font-weight:700}
  .pauto{border:1px solid var(--hair);background:var(--card);color:var(--ink-soft);border-radius:999px;
      font-size:.66rem;font-weight:600;letter-spacing:.04em;padding:3px 10px;cursor:pointer;font-family:inherit;
      display:flex;align-items:center;gap:5px;transition:all .15s}
  .pauto:hover{color:var(--crema);border-color:var(--crema)}
  .pauto[aria-pressed="true"]{background:var(--crema);color:#fff;border-color:var(--crema)}
  .pauto:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
  .ptext{margin:4px 0 0;font-size:.93rem;line-height:1.42}
  .ptext b{color:var(--ink);font-weight:600}
  .ptext .hl{color:var(--crema);font-weight:600;font-family:"JetBrains Mono",monospace;font-size:.9em}
  .dots{display:flex;gap:6px;justify-content:center;padding:2px 0 12px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--hair);cursor:pointer;transition:transform .2s,background .2s}
  .dots i.on{background:var(--crema);transform:scale(1.3)}
  .dots i.done{background:color-mix(in oklab,var(--crema) 45%,var(--hair))}

  .allsteps{margin:8px 20px 0}
  .allsteps>summary{cursor:pointer;font-size:.78rem;color:var(--ink-soft);font-weight:600;
      list-style:none;display:flex;align-items:center;gap:6px;padding:6px 0;user-select:none}
  .allsteps>summary::-webkit-details-marker{display:none}
  .allsteps>summary::before{content:"▸";color:var(--crema);transition:transform .2s;display:inline-block}
  .allsteps[open]>summary::before{transform:rotate(90deg)}
  .allsteps ol.steps{padding:6px 0 0}

  /* scene primitives */
  .scene .ln{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .scene .lnS{fill:none;stroke:var(--ink-soft);stroke-width:4;stroke-linecap:round}
  .scene .cr{fill:var(--crema)}
  .scene .crL{fill:color-mix(in oklab,var(--crema) 40%,transparent)}
  .scene .cd{fill:var(--card)}
  .scene .ink{fill:var(--ink)}
  .scene .wt{fill:color-mix(in oklab,var(--crema) 22%,var(--card))}
  .scene .flame{fill:var(--copper)}
  .scene [class*="a-"]{transform-box:fill-box}
  .a-drip{animation:drip 1.1s ease-in infinite}
  .a-steam{animation:steam 2.2s ease-out infinite}
  .a-fall{animation:fall 1s ease-in infinite}
  .a-press{animation:press 1.8s ease-in-out infinite;transform-origin:center}
  .a-plunge{animation:plunge 1.9s ease-in-out infinite alternate;transform-origin:top}
  .a-bubble{animation:bubble 1.8s ease-in infinite}
  .a-spin{animation:spin 1.1s linear infinite;transform-origin:center}
  .a-shk{animation:shk .32s ease-in-out infinite;transform-origin:center}
  .a-tick{animation:spin 3s linear infinite;transform-origin:center}
  .a-sway{animation:sway 2.6s ease-in-out infinite;transform-origin:top center}
  .a-fill{animation:fillUp 2.6s ease-out infinite;transform-origin:bottom}
  @keyframes drip{0%{transform:translateY(-4px);opacity:0}18%{opacity:1}100%{transform:translateY(44px);opacity:0}}
  @keyframes steam{0%{transform:translateY(2px) scaleX(.9);opacity:0}30%{opacity:.65}100%{transform:translateY(-26px) scaleX(1.25);opacity:0}}
  @keyframes fall{0%{transform:translateY(-8px);opacity:0}25%{opacity:1}100%{transform:translateY(40px);opacity:0}}
  @keyframes press{0%,100%{transform:translateY(-6px)}55%{transform:translateY(6px)}}
  @keyframes plunge{0%{transform:translateY(-2px)}100%{transform:translateY(30px)}}
  @keyframes bubble{0%{transform:translateY(2px) scale(.5);opacity:0}30%{opacity:.85}100%{transform:translateY(-30px) scale(1);opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shk{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  @keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
  @keyframes fillUp{0%{transform:scaleY(.05)}100%{transform:scaleY(1)}}
  @media (prefers-reduced-motion:reduce){
    .scene [class*="a-"]{animation:none !important}
    .stage .scene{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 26 26" fill="none" stroke="#fff8ef" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path class="cupsteam" d="M10 6.4c-1-1 .8-1.9 0-3"/>
          <path class="cupsteam s2" d="M14 6.4c-1-1 .8-1.9 0-3"/>
          <path d="M5.2 10.5h11.2v3.4a5.6 5.6 0 0 1-11.2 0z" fill="rgba(255,255,255,.16)"/>
          <path d="M16.4 11.2a2.9 2.9 0 0 1 0 5.4"/>
          <path d="M4.3 20.2h12.9"/>
        </svg>
      </div>
      <div>
        <h1>Espresso</h1>
        <p>Grind &amp; recipe guide · your kit</p>
      </div>
    </div>
    <button class="theme-btn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
  </header>

  <p class="label">1 · Machine</p>
  <div class="machines" id="machines" role="group" aria-label="Choose machine"></div>

  <p class="label">2 · Drink</p>
  <div class="drinks" id="drinks" role="group" aria-label="Choose drink"></div>

  <div id="recipe"></div>

  <footer>
    VS3 dial runs ~0–20 (finer = lower). Numbers are <b>starting points</b> — taste, then nudge.<br />
    Built for Or's kitchen · <a href="https://github.com/AdbitRush/espresso">github.com/AdbitRush/espresso</a>
  </footer>
</div>

<script>
/* ---------------------------------------------------------------
   DATA — Varia VS3 settings are "full-turns.dial" starting points
   for a Dedica 51mm pressurized basket & a stovetop moka pot.
----------------------------------------------------------------*/
const BASE_GEAR = {
  scale:  {i:"⚖️", n:"0.1 g pocket scale", w:"Weigh dose in and shot out — the only way grind changes mean anything."},
  beans:  {i:"🌰", n:"Fresh beans, rested 5–14 days", w:"Off-gassing settles after roast; stale beans won't crema no matter the grind."},
  water:  {i:"💧", n:"Filtered water", w:"Half the cup is water. Tap scale ruins taste and clogs the boiler."},
};

const DEDICA_GEAR = {
  tamp51: {i:"🔨", n:"51 mm tamper", w:"The Dedica is 51 mm, not 58 — the plastic tamper it ships with is undersized.", star:"key"},
  wdt:    {i:"🧷", n:"WDT distribution tool", w:"Stir the grounds with fine needles before tamping — kills channeling even in pressurized baskets."},
  funnel: {i:"⭕", n:"51 mm dosing funnel", w:"Grind straight into the basket with zero mess on the rim."},
  pitcher:{i:"🥛", n:"350 ml steel milk jug", w:"You can't texture milk in the plastic cup — a cold steel pitcher is essential for the wand."},
  therm:  {i:"🌡️", n:"Milk thermometer / temp strip", w:"Dedica's wand has no auto-stop. Pull at 60–65 °C or you scald the milk sweet spot."},
  knock:  {i:"🗑️", n:"Knock box", w:"Bang the puck out in one move instead of digging at the basket."},
};

const MOKA_GEAR = {
  gasket: {i:"⭕", n:"Spare silicone gasket", w:"The rubber seal hardens and leaks — a spare keeps pressure (and coffee) where it belongs."},
  frother:{i:"🌀", n:"Handheld milk frother", w:"No steam wand here — a €5 whisk froths warm milk for a moka cappuccino."},
  trivet: {i:"🔥", n:"Small burner / trivet", w:"A big flame licking up the sides scorches the pot. Keep the base fully on a small ring."},
};

const COLD_GEAR = {

    <path class="ln" d="M108 100v8"/><path class="cd" d="M92 108h32v8a16 8 0 0 1-32 0z"/><path class="ln" d="M92 108h32v8a16 8 0 0 1-32 0z" fill="none"/></svg>`,
  spiral:`<svg class="scene" viewBox="0 0 220 150"><g transform="rotate(22 78 40)"><rect class="cd" x="56" y="26" width="40" height="26" rx="6"/><rect class="ln" x="56" y="26" width="40" height="26" rx="6" fill="none"/><path class="ln" d="M96 32q18 1 20 12"/></g>
    <path class="lnS a-drip" d="M116 52v16" stroke-width="4"/>
    <path class="ln" d="M86 74h52l-22 40h-8z"/><path class="cr" d="M94 82h36l-15 26h-6z"/>
    <path class="ln" d="M110 128v6"/></svg>`,
  plunge:`<svg class="scene" viewBox="0 0 220 150"><rect class="cd" x="86" y="46" width="48" height="66" rx="6"/><rect class="cr" x="89" y="74" width="42" height="35" rx="4"/>
    <g class="a-plunge"><rect class="ink" x="106" y="20" width="8" height="34" rx="4"/><rect class="ink" x="88" y="52" width="44" height="7" rx="3"/></g>
    <rect class="ln" x="86" y="46" width="48" height="66" rx="6" fill="none"/><path class="ln" d="M134 60q14 4 14 18t-14 16"/><rect class="ink" x="82" y="112" width="56" height="7" rx="3"/></svg>`,
  moka:`<svg class="scene" viewBox="0 0 220 150"><circle class="crL a-bubble" cx="132" cy="44" r="3.4"/><circle class="crL a-bubble" style="animation-delay:.7s" cx="136" cy="40" r="3"/>
    <path class="ink" d="M128 46h12l-3 10h-6z"/><path class="cd" d="M96 46h34l-4 12h-26z"/><path class="ln" d="M96 46h34l-4 12h-26z" fill="none"/><path class="ln" d="M124 44l8-6"/>
    <path class="cd" d="M92 58h40l-6 40h-28z"/><path class="ln" d="M92 58h40l-6 40h-28z" fill="none"/><path class="ln" d="M132 66q10 2 10 10"/>
    <path class="ln" d="M96 98h32"/><path class="flame a-sway" d="M104 100c-6 6-6 14 0 18 4-3 3-7 3-7 2 4 6 4 5 9 5-3 6-9 2-14-2 4-5 2-4-2-2 2-6 1-6-4z"/>
    <path class="flame a-sway" style="animation-delay:.4s" d="M118 100c-6 6-6 14 0 18 4-3 3-7 3-7 2 4 6 4 5 9 5-3 6-9 2-14-2 4-5 2-4-2-2 2-6 1-6-4z"/></svg>`,
  steep:`<svg class="scene" viewBox="0 0 220 150"><path class="lnS" d="M150 34l7 4-7 4M154 38h-14"/><path class="lnS" d="M64 30v14M57 37h14M60 33l8 8M60 41l8-8"/>
    <rect class="cd" x="88" y="40" width="44" height="70" rx="8"/><rect class="cr" x="91" y="66" width="38" height="41" rx="4"/><rect class="crL" x="91" y="60" width="38" height="8"/>
    <circle class="cd a-bubble" style="animation-duration:3s" cx="104" cy="92" r="2.6"/><circle class="cd a-bubble" style="animation-duration:3.4s;animation-delay:1.2s" cx="116" cy="96" r="2.2"/>
    <rect class="ln" x="88" y="40" width="44" height="70" rx="8" fill="none"/><rect class="ink" x="96" y="32" width="28" height="10" rx="3"/></svg>`,
  strain:`<svg class="scene" viewBox="0 0 220 150"><path class="ln" d="M84 34h52l-20 30h-12z"/><path class="cr" d="M92 40h36l-13 20h-10z"/>
    <path class="cr a-drip" d="M110 66v10" stroke="var(--crema)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path class="cd" d="M90 84h40v22a20 10 0 0 1-40 0z"/><path class="ln" d="M90 84h40v24a20 10 0 0 1-40 0z" fill="none"/><rect class="cr" x="94" y="98" width="32" height="12" rx="2"/></svg>`,
  iced:`<svg class="scene" viewBox="0 0 220 150"><path class="cr a-drip" x="108" d="M110 34v14" stroke="var(--crema)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path class="cd" d="M92 54h40l-5 58h-30z"/><path class="wt" d="M95 74h34l-4 36h-26z"/>
    <rect class="cd" x="99" y="62" width="13" height="13" rx="2" transform="rotate(12 105 68)"/><rect class="cd" x="112" y="76" width="13" height="13" rx="2" transform="rotate(-14 118 82)"/><rect class="cd" x="101" y="88" width="12" height="12" rx="2" transform="rotate(20 107 94)"/>
    <path class="ln" d="M92 54h40l-6 58h-28z" fill="none"/><path class="ln" d="M99 62h13v13M112 76h13v13" opacity=".5"/></svg>`,
  shake:`<svg class="scene" viewBox="0 0 220 150"><g class="a-shk"><path class="cd" d="M96 40h28l4 54a18 12 0 0 1-36 0z"/><path class="cr" d="M97 70h26l2 22a14 9 0 0 1-30 0z"/><path class="ln" d="M96 40h28l4 54a18 12 0 0 1-36 0z" fill="none"/><rect class="ink" x="98" y="28" width="24" height="14" rx="4"/>
    <circle class="crL" cx="105" cy="80" r="2.5"/><circle class="crL" cx="116" cy="86" r="2.5"/><circle class="crL" cx="110" cy="92" r="2.5"/></g></svg>`,
  serve:`<svg class="scene" viewBox="0 0 220 150"><path class="lnS a-steam" d="M100 52q-7-10 0-19"/><path class="lnS a-steam" style="animation-delay:.7s" d="M114 52q7-10 0-19"/><path class="lnS a-steam" style="animation-delay:1.3s" d="M107 48q-6-9 0-16"/>
    <rect class="cd" x="74" y="60" width="70" height="42" rx="12"/><ellipse class="cr" cx="109" cy="64" rx="34" ry="7"/><path class="ln" d="M144 68q22 2 22 17t-22 17"/>
    <rect class="ln" x="74" y="60" width="70" height="42" rx="14" fill="none"/><rect class="cr" x="82" y="108" width="56" height="8" rx="4"/></svg>`,
};
const SCENE_RULES=[
  [/shake|shaker/,'shake'],[/plunger|plunge/,'plunge'],[/bloom/,'bloom'],
  [/spiral|drawdown/,'spiral'],[/gurgle|\bassemble\b|medium heat|stovetop|moka pot/,'moka'],
  [/steep|fridge|seal and/,'steep'],[/rinse/,'water'],
  [/strain|paper filter|through .*mesh|double-strain/,'strain'],
  [/\bice\b|iced|over the ice|tall glass with/,'iced'],
  [/steam|texture it|microfoam|stretch/,'steam'],[/grind/,'grind'],
  [/\btamp\b|wdt|distribut|level the bed/,'tamp'],
  [/pull a|shot|first drip|espresso over|brew a|blank shot/,'shot'],
  [/top with|pour.{0,12}milk|cold milk|spoon.*foam|dollop/,'pour'],
  [/boil water|fill.*water|add.*water|combine with|off the boil|water just/,'water'],
];
function sceneFor(step){
  const t=step.toLowerCase();
  for(const [re,name] of SCENE_RULES){ if(re.test(t)) return name; }
  return 'serve';
}

/* --------------------------- render --------------------------- */
const state={ machine:null, drink:null };
const $=s=>document.querySelector(s);
const mEl=$("#machines"), dEl=$("#drinks"), rEl=$("#recipe");

function renderMachines(){
  mEl.innerHTML="";
  for(const [key,m] of Object.entries(MACHINES)){
    const b=document.createElement("button");
    b.className="machine"; b.type="button";
    b.setAttribute("aria-pressed", state.machine===key);
    b.innerHTML=`<span class="ic" aria-hidden="true">${m.ic}</span>
      <span class="mn">${m.name}</span><span class="ms">${m.sub}</span>`;
    b.onclick=()=>{ state.machine=key; state.drink=null; save(); renderMachines(); renderDrinks(); renderRecipe(); };
    mEl.appendChild(b);
  }
}

function renderDrinks(){
  dEl.innerHTML="";
  if(!state.machine){ dEl.innerHTML=`<span style="color:var(--ink-soft);font-size:.85rem">Pick a machine first ↑</span>`; return; }
  const drinks=MACHINES[state.machine].drinks;
  for(const [key,d] of Object.entries(drinks)){
    const b=document.createElement("button");
    b.className="chip"; b.type="button";
    b.setAttribute("aria-pressed", state.drink===key);
    b.textContent=d.name;
    b.onclick=()=>{ state.drink=key; save(); renderDrinks(); renderRecipe(); };
    dEl.appendChild(b);
  }
}

function renderRecipe(){
  stopTimer(); stopAuto();
  if(!state.machine || !state.drink){ rEl.innerHTML=""; return; }
  const d=MACHINES[state.machine].drinks[state.drink];
  const gearHTML=d.gear.map(x=>`<li><span class="gi" aria-hidden="true">${x.i}</span>
      <div><div class="gn">${x.n}${x.star?`<span class="star">${x.star}</span>`:""}</div>
      <div class="gw">${x.w}</div></div></li>`).join("");
  const milkHTML=d.milk?`<div class="sec-t">Milk</div><div class="milk-box">
      <div class="mt">Texture &amp; heat</div>${d.milk}</div>`:"";

  rEl.innerHTML=`<div class="recipe">
    <div class="rhead">
      <h2>${d.name}</h2>
      <p class="sub">${d.tag}</p>
    </div>
    <div class="readout" role="group" aria-label="Recipe numbers">
      <div class="cell grind"><div class="k">VS3 grind</div><div class="v">${d.grind}</div><div class="u">on dial</div></div>
      <div class="cell"><div class="k">Dose</div><div class="v">${d.dose}</div><div class="u">in</div></div>
      <div class="cell"><div class="k">Yield</div><div class="v">${d.yield}</div><div class="u">out</div></div>
      <div class="cell"><div class="k">Time</div><div class="v">${d.time}</div><div class="u">${d.temp}</div></div>
    </div>
    <p class="dial-note"><b>Dial in →</b><span>${d.dial}</span></p>

    <div class="sec-t">Steps</div>
    ${playerHTML(d.steps)}
    ${timerHTML(d.timer)}
    <details class="allsteps"><summary>All steps as a list</summary>
      <ol class="steps">${d.steps.map(s=>`<li>${s}</li>`).join("")}</ol></details>
    ${milkHTML}
    <div class="sec-t" style="margin-top:22px">Gear that helps</div>
    <div class="gear"><ul>${gearHTML}</ul></div>
  </div>`;
  wirePlayer(d.steps);
  wireTimer(d.timer);
}

/* --------------------------- step player --------------------------- */
let pSteps=[], pScenes=[], pIdx=0, pAuto=false, pTimer=null;
function playerHTML(steps){
  pSteps=steps; pScenes=steps.map(sceneFor); pIdx=0;
  const dots=steps.map((_,i)=>`<i data-i="${i}" class="${i===0?'on':''}"></i>`).join("");
  return `<div class="player">
    <div class="stage" id="stage">${SCENES[pScenes[0]]}</div>
    <div class="pctl">
      <button class="pnav" id="pprev" type="button" aria-label="Previous step" disabled>‹</button>
      <div class="pmid">
        <div class="prow"><span class="pn" id="pn">Step 1 / ${steps.length}</span>
          <button class="pauto" id="pauto" type="button" aria-pressed="false">▶ Auto</button></div>
        <p class="ptext" id="ptext">${steps[0]}</p>
      </div>
      <button class="pnav" id="pnext" type="button" aria-label="Next step"${steps.length<2?' disabled':''}>›</button>
    </div>
    <div class="dots" id="dots">${dots}</div>
  </div>`;
}
function setStep(i){
  pIdx=Math.max(0,Math.min(pSteps.length-1,i));
  const stage=$("#stage"); if(!stage) return;
  stage.innerHTML=SCENES[pScenes[pIdx]]||SCENES.serve;
  $("#ptext").innerHTML=pSteps[pIdx];
  $("#pn").textContent=`Step ${pIdx+1} / ${pSteps.length}`;
  $("#pprev").disabled=pIdx===0;
  $("#pnext").disabled=pIdx===pSteps.length-1;
  [...$("#dots").children].forEach((el,j)=>{
    el.className = j===pIdx?"on":(j<pIdx?"done":"");
  });
}
function stopAuto(){ if(pTimer){ clearInterval(pTimer); pTimer=null; } pAuto=false;
  const b=$("#pauto"); if(b){ b.setAttribute("aria-pressed","false"); b.textContent="▶ Auto"; } }
function wirePlayer(steps){
  if(!steps||!steps.length) return;
  const prev=$("#pprev"), next=$("#pnext"), auto=$("#pauto"), dots=$("#dots");
  prev.onclick=()=>{ stopAuto(); setStep(pIdx-1); };
  next.onclick=()=>{ stopAuto(); setStep(pIdx+1); };
  dots.onclick=e=>{ const i=e.target.dataset.i; if(i!=null){ stopAuto(); setStep(+i); } };
  auto.onclick=()=>{
    if(pAuto){ stopAuto(); return; }
    pAuto=true; auto.setAttribute("aria-pressed","true"); auto.textContent="⏸ Auto";
    if(pIdx>=pSteps.length-1) setStep(0);
    pTimer=setInterval(()=>{
      if(pIdx>=pSteps.length-1){ stopAuto(); return; }
      setStep(pIdx+1);
    },3800);
  };
}

/* ----------------------------- timer ----------------------------- */
let tHandle=null, tStart=0, tTarget=0, tLabel="";
function timerHTML(t){
  if(!t) return "";
  tTarget=t.target; tLabel=t.label;
  const tg = t.target>=60 ? `${Math.round(t.target/60)} min` : `${t.target}s`;
  return `<div class="timer">
    <div class="disp" id="disp">0:00</div>
    <div class="meta"><div class="tt">${t.label}</div><div class="tgt">target · ${tg}</div></div>
    <button class="tbtn" id="tstart" type="button">Start</button>
    <button class="tbtn rst" id="treset" type="button">Reset</button>
  </div>`;
}
function fmt(s){ const m=Math.floor(s/60); const ss=s%60; return `${m}:${String(ss).padStart(2,"0")}`; }
function wireTimer(t){
  if(!t) return;
  const disp=$("#disp"), start=$("#tstart"), reset=$("#treset");
  start.onclick=()=>{
    if(tHandle){ stopTimer(); start.textContent="Start"; return; }
    tStart=Date.now(); start.textContent="Stop";
    tHandle=setInterval(()=>{
      const el=Math.floor((Date.now()-tStart)/1000);
      disp.textContent=fmt(el);
      disp.classList.toggle("hot", el>0 && el<tTarget);
      disp.classList.toggle("over", el>=tTarget);
    },200);
  };
  reset.onclick=()=>{ stopTimer(); disp.textContent="0:00"; disp.className="disp"; if(start) start.textContent="Start"; };
}
function stopTimer(){ if(tHandle){ clearInterval(tHandle); tHandle=null; } }

/* --------------------------- theme + persist --------------------------- */
const themeBtn=$("#theme");
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); }
themeBtn.onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark";
  applyTheme(next); localStorage.setItem("espresso.theme",next);
};
function save(){ localStorage.setItem("espresso.sel", JSON.stringify(state)); }
function restore(){
  applyTheme(localStorage.getItem("espresso.theme"));
  try{ const s=JSON.parse(localStorage.getItem("espresso.sel")||"{}");
    if(s.machine && MACHINES[s.machine]){ state.machine=s.machine;
      if(s.drink && MACHINES[s.machine].drinks[s.drink]) state.drink=s.drink; } }catch(e){}
}

restore(); renderMachines(); renderDrinks(); renderRecipe();
</script>
</body>
